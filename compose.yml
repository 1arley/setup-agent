services:
  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    restart: unless-stopped
    # false = o /init (s6-overlay) do próprio imagem vira PID 1.
    # Com init:true o s6 e supresso e os gateways por perfil nao sao supervisionados.
    init: false
    command: gateway run

    environment:
      # Acesso ao Docker via proxy somente-leitura (sem o socket montado direto)
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      # Remapeia o usuario hermes interno para o UID/GID do host,
      # para os arquivos em ./data ficarem legiveis fora do container.
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}

    volumes:
      - ./data:/opt/data

    ports:
      - "127.0.0.1:8642:8642"

    mem_limit: 4g
    cpus: 2.0

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: hermes-docker-proxy
    restart: unless-stopped

    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      INFO: "1"
      NETWORKS: "1"
      VOLUMES: "1"
      SYSTEM: "1"

      # Bloqueia todas as operações de escrita
      POST: "0"
      AUTH: "0"
      SECRETS: "0"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    expose:
      - "2375"
